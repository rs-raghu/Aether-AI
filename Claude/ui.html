<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 16px;
      background: #ffffff;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
    }

    h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #000;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #333;
    }

    textarea, input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
    }

    textarea {
      min-height: 80px;
    }

    textarea:focus, input:focus {
      outline: none;
      border-color: #18a0fb;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #18a0fb;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #1591e8;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      text-align: center;
      margin: 16px 0;
      color: #666;
    }

    .loading.active {
      display: block;
    }

    .results {
      margin-top: 20px;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 8px;
      display: none;
    }

    .results.active {
      display: block;
    }

    .result-section {
      margin-bottom: 16px;
    }

    .result-section:last-child {
      margin-bottom: 0;
    }

    .result-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #000;
    }

    .result-content {
      font-size: 12px;
      color: #333;
      line-height: 1.5;
    }

    .color-palette {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .color-swatch {
      width: 50px;
      height: 50px;
      border-radius: 4px;
      border: 1px solid #ddd;
      position: relative;
      cursor: pointer;
    }

    .color-label {
      font-size: 9px;
      text-align: center;
      margin-top: 4px;
      color: #666;
    }

    .font-item {
      padding: 8px;
      background: white;
      border-radius: 4px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
    }

    .apply-btn {
      margin-top: 16px;
      background: #7b61ff;
    }

    .apply-btn:hover {
      background: #6c52e0;
    }

    .error {
      color: #f24822;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }

    .error.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>AI Design Assistant</h2>
    
    <div class="input-group">
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="Enter your Gemini API key">
    </div>

    <div class="input-group">
      <label for="projectDescription">What are you designing?</label>
      <textarea 
        id="projectDescription" 
        placeholder="E.g., A modern e-commerce website for selling sustainable fashion products aimed at millennials"
      ></textarea>
    </div>

    <button id="generateBtn">Generate Design Suggestions</button>
    
    <div class="loading" id="loading">
      <p>🤖 AI is analyzing your project...</p>
    </div>

    <div class="error" id="error"></div>

    <div class="results" id="results">
      <div class="result-section">
        <div class="result-title">Typography</div>
        <div class="result-content" id="typography"></div>
      </div>

      <div class="result-section">
        <div class="result-title">Color Palette</div>
        <div class="color-palette" id="colorPalette"></div>
      </div>

      <div class="result-section">
        <div class="result-title">Spacing Guidelines</div>
        <div class="result-content" id="spacing"></div>
      </div>

      <div class="result-section">
        <div class="result-title">Design Recommendations</div>
        <div class="result-content" id="recommendations"></div>
      </div>

      <button class="apply-btn" id="applyBtn">Apply Styles to Figma</button>
    </div>
  </div>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const projectInput = document.getElementById('projectDescription');
    const generateBtn = document.getElementById('generateBtn');
    const loading = document.getElementById('loading');
    const results = document.getElementById('results');
    const error = document.getElementById('error');
    const applyBtn = document.getElementById('applyBtn');

    let currentSuggestions = null;

    generateBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      const description = projectInput.value.trim();

      if (!apiKey) {
        showError('Please enter your Gemini API key');
        return;
      }

      if (!description) {
        showError('Please describe your project');
        return;
      }

      hideError();
      loading.classList.add('active');
      results.classList.remove('active');
      generateBtn.disabled = true;

      try {
        const suggestions = await getDesignSuggestions(apiKey, description);
        currentSuggestions = suggestions;
        displayResults(suggestions);
      } catch (err) {
        showError(err.message);
      } finally {
        loading.classList.remove('active');
        generateBtn.disabled = false;
      }
    });

    applyBtn.addEventListener('click', () => {
      if (currentSuggestions) {
        parent.postMessage({
          pluginMessage: {
            type: 'apply-styles',
            data: currentSuggestions
          }
        }, '*');
      }
    });

    async function getDesignSuggestions(apiKey, description) {
      const prompt = `You are an expert UI/UX designer. Based on this project description, provide comprehensive design suggestions in JSON format.

Project: ${description}

Provide a JSON response with this exact structure:
{
  "typography": {
    "headingFont": "Font name",
    "bodyFont": "Font name",
    "sizes": {
      "h1": "size in px",
      "h2": "size in px",
      "h3": "size in px",
      "body": "size in px",
      "small": "size in px"
    }
  },
  "colors": {
    "primary": "#hexcode",
    "secondary": "#hexcode",
    "accent": "#hexcode",
    "background": "#hexcode",
    "text": "#hexcode"
  },
  "spacing": {
    "base": "8px",
    "small": "4px",
    "medium": "16px",
    "large": "32px",
    "xlarge": "64px"
  },
  "recommendations": [
    "Recommendation 1",
    "Recommendation 2",
    "Recommendation 3"
  ]
}

Only return valid JSON, no other text.`;

      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: prompt
              }]
            }]
          })
        }
      );

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error?.message || 'Failed to get AI suggestions');
      }

      const data = await response.json();
      const text = data.candidates[0].content.parts[0].text;
      
      // Extract JSON from response
      const jsonMatch = text.match(/\{[\s\S]*\}/);
      if (!jsonMatch) {
        throw new Error('Invalid response from AI');
      }

      return JSON.parse(jsonMatch[0]);
    }

    function displayResults(suggestions) {
      // Typography
      const typoDiv = document.getElementById('typography');
      typoDiv.innerHTML = `
        <div class="font-item">
          <strong>Heading:</strong> ${suggestions.typography.headingFont}<br>
          <strong>Body:</strong> ${suggestions.typography.bodyFont}<br>
          <strong>Sizes:</strong> H1: ${suggestions.typography.sizes.h1}, H2: ${suggestions.typography.sizes.h2}, Body: ${suggestions.typography.sizes.body}
        </div>
      `;

      // Colors
      const colorDiv = document.getElementById('colorPalette');
      colorDiv.innerHTML = '';
      Object.entries(suggestions.colors).forEach(([name, hex]) => {
        const swatch = document.createElement('div');
        swatch.innerHTML = `
          <div class="color-swatch" style="background-color: ${hex}"></div>
          <div class="color-label">${name}<br>${hex}</div>
        `;
        colorDiv.appendChild(swatch);
      });

      // Spacing
      const spacingDiv = document.getElementById('spacing');
      spacingDiv.innerHTML = Object.entries(suggestions.spacing)
        .map(([key, value]) => `<strong>${key}:</strong> ${value}`)
        .join('<br>');

      // Recommendations
      const recsDiv = document.getElementById('recommendations');
      recsDiv.innerHTML = suggestions.recommendations
        .map(rec => `• ${rec}`)
        .join('<br>');

      results.classList.add('active');
    }

    function showError(message) {
      error.textContent = message;
      error.classList.add('active');
    }

    function hideError() {
      error.classList.remove('active');
    }
  </script>
</body>
</html>
